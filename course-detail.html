<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chi tiết khóa học – TechUp Academy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="./assets/images/favicon.png">
  <link href="./css/styles.css" rel="stylesheet">
</head>
<body data-page="detail">
  <main class="container my-5">
    <nav aria-label="breadcrumb"><a href="./courses.html">← Tất cả khóa học</a></nav>
    <div id="detail" class="mt-3"></div>

    <section id="reg-section" class="d-none mt-5">
      <div class="card shadow-sm" id="dang-ky"><div class="card-body">
        <h2 class="h4">Đăng ký khóa học</h2>
        <p class="text-muted">Khóa học: <strong id="reg-course"></strong></p>
        <form id="reg-form" novalidate>
          <div class="mb-3"><label class="form-label" for="name">Họ tên *</label><input class="form-control" id="name" name="name" autocomplete="name" required><div class="invalid-feedback" id="err-name"></div></div>
          <div class="mb-3"><label class="form-label" for="email">Email *</label><input class="form-control" id="email" name="email" type="email" autocomplete="email" required><div class="invalid-feedback" id="err-email"></div></div>
          <div class="mb-3"><label class="form-label" for="phone">Số điện thoại (không bắt buộc)</label><input class="form-control" id="phone" name="phone" type="tel" autocomplete="tel"><div class="invalid-feedback" id="err-phone"></div></div>
          <button class="btn btn-primary" type="submit">Gửi đăng ký</button>
        </form>
        <div id="reg-result" class="mt-3" aria-live="polite"></div>
      </div></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/config.js"></script>
  <script src="./js/supabase-client.js"></script>
  <script src="./js/courses.js"></script>
  <script src="./js/registrations.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
