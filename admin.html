<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Quản trị khóa học – TechUp Academy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="./assets/images/favicon.png">
  <link href="./css/styles.css" rel="stylesheet">
</head>
<body data-page="admin">
  <header class="page-head"><div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
    <h1 class="mb-0">Quản trị khóa học</h1>
    <div id="who" class="small"></div>
  </div></header>

  <main class="container my-4">
    <p class="text-muted small">Quyền thêm, sửa, xóa được kiểm tra tại database (RLS) theo tài khoản đăng nhập. Việc hiển thị trang này không phải là biện pháp bảo mật.</p>

    <section id="login-box" class="d-none">
      <div class="card shadow-sm col-md-6 mx-auto"><div class="card-body">
        <h2 class="h5">Đăng nhập quản trị</h2>
        <form id="login-form" novalidate>
          <div class="mb-3"><label class="form-label" for="l-email">Email</label><input class="form-control" id="l-email" type="email" autocomplete="username" required></div>
          <div class="mb-3"><label class="form-label" for="l-pass">Mật khẩu</label><input class="form-control" id="l-pass" type="password" autocomplete="current-password" required></div>
          <button class="btn btn-primary" type="submit">Đăng nhập</button>
        </form>
        <div id="login-msg" class="mt-3" aria-live="polite"></div>
      </div></div>
    </section>

    <section id="panel" class="d-none">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h5 mb-0">Danh sách khóa học</h2>
        <button id="btn-new" class="btn btn-primary btn-sm" type="button">+ Thêm khóa học</button>
      </div>

      <div id="form-wrap" class="card shadow-sm mb-4 d-none"><div class="card-body">
        <h3 class="h5" id="form-title">Thêm khóa học</h3>
        <form id="c-form" novalidate>
          <input type="hidden" id="c-id">
          <div class="row g-3">
            <div class="col-md-8"><label class="form-label" for="c-title">Tên khóa học *</label><input class="form-control" id="c-title" maxlength="150"></div>
            <div class="col-md-4"><label class="form-label" for="c-slug">Slug (để trống sẽ tự tạo)</label><input class="form-control" id="c-slug" maxlength="150"></div>
            <div class="col-md-4"><label class="form-label" for="c-category">Danh mục *</label><input class="form-control" id="c-category" maxlength="50" list="cats"><datalist id="cats"><option value="Web"><option value="Lập trình"><option value="Thiết kế"><option value="AI"></datalist></div>
            <div class="col-md-4"><label class="form-label" for="c-level">Trình độ *</label>
              <select class="form-select" id="c-level"><option value="Beginner">Cơ bản</option><option value="Intermediate">Trung cấp</option><option value="Advanced">Nâng cao</option></select></div>
            <div class="col-md-4"><label class="form-label" for="c-duration">Thời lượng *</label><input class="form-control" id="c-duration" maxlength="50" placeholder="6 tuần"></div>
            <div class="col-md-4"><label class="form-label" for="c-price">Học phí (₫) *</label><input class="form-control" id="c-price" type="number" min="0" step="1000"></div>
            <div class="col-md-8"><label class="form-label" for="c-image">URL ảnh (không bắt buộc)</label><input class="form-control" id="c-image" type="url" placeholder="https://..."></div>
            <div class="col-12"><label class="form-label" for="c-desc">Mô tả ngắn *</label><textarea class="form-control" id="c-desc" rows="2" maxlength="300"></textarea></div>
            <div class="col-12"><label class="form-label" for="c-full">Nội dung chi tiết (mỗi mục nội dung bắt đầu bằng "- ")</label><textarea class="form-control" id="c-full" rows="5"></textarea></div>
            <div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" id="c-featured"><label class="form-check-label" for="c-featured">Khóa học nổi bật</label></div></div>
          </div>
          <div id="form-err" class="text-danger small mt-3" aria-live="polite"></div>
          <div class="mt-3"><button class="btn btn-primary me-2" type="submit">Lưu</button><button class="btn btn-light" type="button" id="btn-cancel">Đóng</button></div>
        </form>
      </div></div>

      <div id="table-box"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/config.js"></script>
  <script src="./js/supabase-client.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/courses.js"></script>
  <script src="./js/registrations.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/admin.js"></script>
</body>
</html>
