<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Khóa học – TechUp Academy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="./assets/images/favicon.png">
  <link href="./css/styles.css" rel="stylesheet">
</head>
<body data-page="courses">
  <header class="page-head"><div class="container"><h1>Danh sách khóa học</h1></div></header>
  <main class="container my-4">
    <form class="row g-2 mb-4" onsubmit="return false">
      <div class="col-md-4"><label class="form-label" for="q">Tìm theo tên</label><input id="q" class="form-control" type="search" placeholder="Ví dụ: Python"></div>
      <div class="col-6 col-md-2"><label class="form-label" for="cat">Danh mục</label><select id="cat" class="form-select"><option value="">Tất cả</option></select></div>
      <div class="col-6 col-md-3"><label class="form-label" for="lv">Trình độ</label>
        <select id="lv" class="form-select"><option value="">Tất cả</option><option value="Beginner">Cơ bản</option><option value="Intermediate">Trung cấp</option><option value="Advanced">Nâng cao</option></select></div>
      <div class="col-md-3"><label class="form-label" for="sort">Sắp xếp học phí</label>
        <select id="sort" class="form-select"><option value="">Mặc định</option><option value="asc">Thấp → cao</option><option value="desc">Cao → thấp</option></select></div>
    </form>
    <div id="grid" class="row g-4"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/config.js"></script>
  <script src="./js/supabase-client.js"></script>
  <script src="./js/courses.js"></script>
  <script src="./js/registrations.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
